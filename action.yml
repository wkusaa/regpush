name: regpush
description: Push an already-built local Docker image through a chunk-aware OCI registry upload protocol
author: wkusaa

inputs:
  image:
    description: Fully qualified local image reference, including registry and repository
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password
    required: true
  insecure-http:
    description: Allow plain HTTP instead of HTTPS
    required: false
    default: "false"
  cleanup:
    description: Disable caching and remove all artifacts after the push
    required: false
    default: "false"

runs:
  using: node24
  main: dist/index.js

branding:
  icon: upload-cloud
  color: orange
