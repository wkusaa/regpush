name: Update latest tag

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: update-latest-tag
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Point latest at the verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Query the current latest release so a delayed older event cannot roll it back.
          release_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag, got: $release_tag" >&2
            exit 1
          fi
          git fetch origin "refs/tags/$release_tag"
          release_commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          verified=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$release_commit" --status success --json databaseId --jq 'length')
          if [[ "$verified" == 0 ]]; then
            echo "Release $release_tag has no successful CI run; latest was not changed." >&2
            exit 1
          fi
          previous_tag=$(git ls-remote origin refs/tags/latest | cut -f1)
          git push --force-with-lease="refs/tags/latest:$previous_tag" origin "$release_commit:refs/tags/latest"
          echo "latest now points to $release_tag ($release_commit)"
